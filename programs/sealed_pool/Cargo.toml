[package]
name = "sealed_pool"
version = "0.1.0"
description = "Tell sealed pool: constant-product pool reachable only through envelopes"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "sealed_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "envelope/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
envelope = { path = "../envelope", features = ["cpi"] }
