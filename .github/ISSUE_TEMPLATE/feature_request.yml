name: Feature request
description: Propose a change or a new consumer program
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a sender or a reader of the chain not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The instruction, account or consumer you have in mind. Installed programs have no upgrade authority, so a change to one is a new program.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
